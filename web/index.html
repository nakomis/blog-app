  <!-- Theme, applied before first paint (BAPP-10). This is deliberately inline
       and synchronous: doing it from React would leave the default (dark)
       painted for a frame first, which is a white-to-dark or dark-to-white
       flash on every load for anyone whose choice differs from the default.
       Only an explicit stored choice sets data-theme — with nothing stored the
       attribute stays absent so the prefers-color-scheme rule can win. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) { /* private mode: fall through to system preference */ }
    })();
  </script>
