name: Publish scheduled posts

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC daily
  workflow_dispatch:        # allow manual trigger
  repository_dispatch:
    types: [blog-content-updated]

permissions:
  id-token: write   # required for OIDC token exchange
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blog-app
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Load blog-content deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BLOG_CONTENT_DEPLOY_KEY }}

      - name: Pull latest blog-content
        run: git submodule update --init --remote web/content

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::637423226886:role/blog-app-github-deploy
          aws-region: eu-west-2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

      - name: Deploy
        run: bash scripts/deploy.sh
        working-directory: web

      - name: Set up Python for ingestion
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ingestion dependencies
        run: pip install -r scripts/requirements.txt

      - name: Regenerate search embeddings
        run: python scripts/ingest-blog.py

      - name: Alert on failure
        if: failure()
        run: |
          aws sns publish \
            --topic-arn arn:aws:sns:eu-west-2:637423226886:blog-pipeline-alerts-prod \
            --subject "blog-app scheduled-publish FAILED" \
            --message "The scheduled-publish workflow failed — check whether the blog deployed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # Mirror any newly-live posts to nakomis.substack.com (PIPE-11). Runs on the
  # self-hosted runner on Luke (PIPE-18): Substack's Cloudflare challenges
  # GitHub-hosted (datacentre) runner IPs regardless of session validity, so
  # this job needs a residential IP. Separate job so a mirror failure can
  # never block the blog deploy itself.
  substack:
    needs: publish
    runs-on: [self-hosted, substack]
    steps:
      - name: Checkout blog-app
        uses: actions/checkout@v4
        with:
          submodules: false

      # The runner container is minimal Ubuntu — make sure python3 + venv
      # exist (persists in the container between jobs, so usually a no-op).
      # Runs before anything that can fail so the alert step below always has
      # a working boto3.
      - name: Ensure Python
        run: |
          if ! command -v python3 >/dev/null || ! python3 -m venv --help >/dev/null 2>&1; then
            apt-get update && apt-get install -y python3 python3-venv
          fi

      - name: Install sync dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r scripts/requirements.txt

      # Unlike GitHub-hosted runners, the container has no pre-seeded SSH
      # known_hosts — without this the submodule clone fails host verification.
      - name: Trust github.com host keys
        run: |
          mkdir -p ~/.ssh
          grep -q github.com ~/.ssh/known_hosts 2>/dev/null || ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Load blog-content deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BLOG_CONTENT_DEPLOY_KEY }}

      - name: Pull latest blog-content
        run: git submodule update --init --remote web/content

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::637423226886:role/blog-app-github-deploy
          aws-region: eu-west-2

      - name: Mirror new posts to Substack
        run: .venv/bin/python scripts/substack-sync.py --content-dir web/content/blog

      # No aws CLI on this runner — publish the alert with the venv's boto3.
      - name: Alert on failure
        if: failure()
        run: |
          .venv/bin/python - <<'EOF'
          import boto3
          boto3.client("sns", region_name="eu-west-2").publish(
              TopicArn="arn:aws:sns:eu-west-2:637423226886:blog-pipeline-alerts-prod",
              Subject="blog-app substack-mirror FAILED",
              Message="The Substack mirror job failed on the Luke runner. "
                      "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
          )
          EOF
