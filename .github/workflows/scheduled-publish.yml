name: Publish scheduled posts

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC daily
  workflow_dispatch:        # allow manual trigger
  repository_dispatch:
    types: [blog-content-updated]

permissions:
  id-token: write   # required for OIDC token exchange
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blog-app
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Load blog-content deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BLOG_CONTENT_DEPLOY_KEY }}

      - name: Pull latest blog-content
        run: git submodule update --init --remote web/content

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::637423226886:role/blog-app-github-deploy
          aws-region: eu-west-2

      # pnpm (version pinned via web/package.json "packageManager"). Must precede
      # setup-node so its cache can key off the pnpm store.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      # No ~/.npmrc on the runner, so pnpm resolves from npmjs. The lockfile is
      # registry-agnostic (integrity hashes only, no hostnames), so this is the
      # same dependency tree a developer gets resolving through the home Nexus
      # proxy. npm could not do this: it bakes the resolved host into
      # package-lock.json, so a lockfile built at home 401s here.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Build
        run: pnpm run build
        working-directory: web

      - name: Deploy
        run: bash scripts/deploy.sh
        working-directory: web

      - name: Set up Python for ingestion
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ingestion dependencies
        run: pip install -r scripts/requirements.txt

      - name: Regenerate search embeddings
        run: python scripts/ingest-blog.py

      - name: Alert on failure
        if: failure()
        run: |
          aws sns publish \
            --topic-arn arn:aws:sns:eu-west-2:637423226886:blog-pipeline-alerts-prod \
            --subject "blog-app scheduled-publish FAILED" \
            --message "The scheduled-publish workflow failed — check whether the blog deployed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # Mirror any newly-live posts to nakomis.substack.com (PIPE-11). Runs on the
  # self-hosted runner on Luke (PIPE-18): Substack's Cloudflare challenges
  # GitHub-hosted (datacentre) runner IPs regardless of session validity, so
  # this job needs a residential IP. Separate job so a mirror failure can
  # never block the blog deploy itself.
  substack:
    needs: publish
    runs-on: [self-hosted, substack]
    steps:
      - name: Checkout blog-app
        uses: actions/checkout@v4
        with:
          submodules: false

      # python3/venv and the seeded github.com known_hosts are baked into the
      # runner image by Luke's Ansible (home-infra) — the workflow must never
      # install packages on that box. First so the failure alert below always
      # has a working boto3.
      - name: Install sync dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r scripts/requirements.txt

      - name: Load blog-content deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BLOG_CONTENT_DEPLOY_KEY }}

      - name: Pull latest blog-content
        run: git submodule update --init --remote web/content

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::637423226886:role/blog-app-github-deploy
          aws-region: eu-west-2

      - name: Mirror new posts to Substack
        run: .venv/bin/python scripts/substack-sync.py --content-dir web/content/blog

      # Announce at most one new post on Bluesky (PIPE-20): post-cutoff posts
      # only, 3-day minimum gap, idempotent against the profile's own feed.
      #
      # The teaser is written by a Claude Code Routine rather than a Bedrock call
      # (PIPE-32). `/fire` is fire-and-forget — it returns a session URL, not the
      # routine's output — so the routine does the posting itself. Every guard
      # still runs in bluesky-announce.py: the gap and idempotency checks below,
      # the URL guard inside the routine's `--post` call.
      #
      # ROLLBACK: delete these two steps and restore the single line
      #   run: .venv/bin/python scripts/bluesky-announce.py --content-dir web/content/blog
      # which still works end to end, teaser from Bedrock.
      - name: Select a post to announce
        id: select
        run: |
          .venv/bin/python scripts/bluesky-announce.py \
            --select --content-dir web/content/blog > "$RUNNER_TEMP/bluesky-payload.txt"
          if [ -s "$RUNNER_TEMP/bluesky-payload.txt" ]; then
            echo "has_post=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_post=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to announce this run."
          fi

      # No jq on this runner (nothing may be installed on Luke), so the venv's
      # python does the JSON escaping — the payload contains a whole article.
      - name: Fire the teaser Routine
        if: steps.select.outputs.has_post == 'true'
        env:
          ROUTINE_URL: ${{ secrets.BLUESKY_ROUTINE_URL }}
          ROUTINE_TOKEN: ${{ secrets.BLUESKY_ROUTINE_TOKEN }}
        run: |
          .venv/bin/python -c \
            'import json,sys; sys.stdout.write(json.dumps({"text": sys.stdin.read()}))' \
            < "$RUNNER_TEMP/bluesky-payload.txt" > "$RUNNER_TEMP/bluesky-fire.json"
          curl -fsS -X POST "$ROUTINE_URL" \
            -H "Authorization: Bearer $ROUTINE_TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/bluesky-fire.json"
          echo
          echo "Routine fired. A green run status only means the session started —"
          echo "open the session URL above to confirm the post actually went out."

      # No aws CLI on this runner — publish the alert with the venv's boto3.
      - name: Alert on failure
        if: failure()
        run: |
          .venv/bin/python - <<'EOF'
          import boto3
          boto3.client("sns", region_name="eu-west-2").publish(
              TopicArn="arn:aws:sns:eu-west-2:637423226886:blog-pipeline-alerts-prod",
              Subject="blog-app substack-mirror FAILED",
              Message="The Substack mirror job failed on the Luke runner. "
                      "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
          )
          EOF
